kind = "web"
previewPath = "/"
title = "SCENE"
description = "Türkçe, sinema ve dizi zevkleri üzerinden insanları buluşturan mobil öncelikli sosyal ağ prototipi."
version = "1.0.0"
id = "artifacts/scene"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23842

[services.development]
run = "pnpm --filter @workspace/scene run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scene", "run", "build" ]
serve = "static"
publicDir = "artifacts/scene/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23842"
BASE_PATH = "/"
